# Ime workflow-a; vidi se na tabu Actions i na PR-u.
name: CI
# Kada se pokreće: na svaki pull request, a push samo kad je na main.
# Push na branch sa otvorenim PR-om ionako pokreće run za PR.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Ime job-a; na PR-u se check zove "CI / check".
  check:
    runs-on: ubuntu-latest
    steps:
      # Kod iz repoa na runner; bez ovoga runner je prazan.
      - uses: actions/checkout@v7
      # Provera da bin/ i .env nikad ne uđu u repo.
      - name: Higijena repoa
        run: |
          git ls-files bin .env
          test -z "$(git ls-files bin .env)"
      # Go, iste verzije kao u go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
