services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: soapstone
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: soapstone
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U soapstone -d soapstone"]
      interval: 2s
      retries: 15
  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://soapstone:${DB_PASSWORD}@db:5432/soapstone?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/soapstone", "healthcheck"]
      interval: 5s
    environment:
      DATABASE_URL: postgres://soapstone:${DB_PASSWORD}@db:5432/soapstone?sslmode=disable
      APP_COLOR: ${APP_COLOR:-steelblue}
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
volumes:
  dbdata:
